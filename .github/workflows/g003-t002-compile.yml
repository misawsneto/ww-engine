name: Verify G003 T002 Compile

on:
  push:
    branches: [g003-t002-verify]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
          rustc --version
          cargo --version
      - name: Provider boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'ww-runtime|ww-store|rusqlite|reqwest|ww-flow|OWS' crates/ww-agent-provider/Cargo.toml crates/ww-agent-provider/src
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
