name: G002 Bootstrap

on:
  push:
    branches: [g002-shared-runtime]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install exact G002 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .g002payload/part00 .g002payload/part01 .g002payload/part02 .g002payload/part03 .g002payload/part04 .g002payload/part05a .g002payload/part05b .g002payload/part05c .g002payload/part05d .g002payload/part06 > "$RUNNER_TEMP/g002.b64"
          bytes=$(wc -c < "$RUNNER_TEMP/g002.b64")
          echo "payload_base64_bytes=$bytes"
          test "$bytes" -eq 25084
          base64 -d "$RUNNER_TEMP/g002.b64" > "$RUNNER_TEMP/g002.tar.gz"
          echo '2c54d74467d246f81ed88dc247f9f479f5a20f0b6239d29e0b5081a7741d49f8  '"$RUNNER_TEMP/g002.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/g002.tar.gz" -C .
          rm -rf .g002payload .bootstrap
          rm -f .github/workflows/g002-bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Apply preflight scaffold correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/ww-runtime/Cargo.toml')
          s = p.read_text()
          if 'futures-util.workspace = true' not in s:
              s = s.replace('[dev-dependencies]\n', '[dev-dependencies]\nfutures-util.workspace = true\n')
              p.write_text(s)
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Normalize formatting
        run: cargo fmt --all

      - name: Verify architecture boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'Agent|FlowToken|OWS|provider|tool.loop' crates/ww-types crates/ww-store crates/ww-store-sqlite crates/ww-runtime

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Commit verified G002 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: establish G002 shared runtime walking skeleton'
          git push origin HEAD:g002-shared-runtime
