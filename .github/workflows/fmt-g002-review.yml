name: Repair G002 Review Typo

on:
  push:
    branches: [g002-shared-runtime]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Repair typo and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/ww-runtime/src/service.rs')
          s = p.read_text()
          if 'Oi(updated)' not in s:
              raise SystemExit('expected typo not found')
          p.write_text(s.replace('Oi(updated)', 'Ok(updated)', 1))
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all -- --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ww-runtime/src/service.rs
          git diff --cached --check
          git commit -m 'fix: correct G002 cancellation return typo'
          git push origin HEAD:main
